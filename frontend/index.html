<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#154e54" />
    <title>Outreach Control</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <!--
    THESIS: Dashboard kerja yang membuat setiap klaim email dapat ditelusuri ke buktinya; menolak pola kartu-metrik generik.
    OWN-WORLD: Bahasa visual laporan Kelompok 1: header tabel teal tua (#154e54), panel teal pucat, callout amber, Lato, garis tipis, angka tabular.
    STORY: Staf sales menyiapkan campaign, meninjau pengecualian (review/blokir) dengan bukti, menyetujui versi draft, lalu memantau agen dan kiriman.
    FIRST VIEWPORT: Bar atas (nama produk, pilihan campaign, status koneksi) + stepper Setup/Preview & Approval/Monitor; di Preview: daftar lead kiri, draft + jejak bukti kanan, aksi Setujui di kepala draft.
    FORM: Operate, perluasan dunia visual laporan (mockup Gambar 4); seed: tidak diacak (brief sudah menetapkan struktur).
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
